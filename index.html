
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WADOUD STORE</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101010;
  color:white;
}
header{
  background:#d90020;
  padding:25px;
  text-align:center;
}
header h1{margin:0;font-size:32px}
header p{margin-bottom:0}
nav{
  background:#1c1c1c;
  padding:15px;
  text-align:center;
}
nav a{color:white;text-decoration:none;margin:12px}
.hero{text-align:center;padding:35px 15px}
.hero h2{color:#ff263e}
.products{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  padding:20px;
}
.card{
  background:#202020;
  border:1px solid #444;
  border-radius:15px;
  width:290px;
  overflow:hidden;
  text-align:center;
  padding-bottom:20px;
}
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}
.card h3{padding:0 10px}
.price{
  color:#ff354b;
  font-size:23px;
  font-weight:bold;
}
button{
  background:#e00025;
  color:white;
  border:0;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}
button:hover{background:#ff2445}
footer{
  margin-top:40px;
  padding:25px;
  text-align:center;
  background:#1b1b1b;
}
</style>
</head>
<body>

<header>
  <h1>WADOUD STORE</h1>
  <p>متجرك للألعاب الرقمية</p>
</header>

<nav>
  <a href="#home">الرئيسية</a>
  <a href="#products">المنتجات</a>
  <a href="#contact">اتصل بنا</a>
</nav>

<section class="hero" id="home">
  <h2>مرحبا بك في WADOUD STORE</h2>
  <p>اكتشف منتجاتنا الرقمية واطلب بسهولة</p>
</section>

<section class="products" id="products">

  <div class="card">
    <img src="fc27.jpg" alt="EA SPORTS FC 27">
    <h3>EA SPORTS FC™ 27</h3>
    <p>مفتاح لعبة رقمي من مصدر مرخّص</p>
    <p class="price">3500 دج</p>
    <button onclick="order()">اطلب عبر Instagram</button>
  </div>

</section>

<footer id="contact">
  <h3>WADOUD STORE</h3>
  <p>شكرا لزيارتكم ❤️</p>
  <p>الطلبات عبر Instagram</p>
</footer>

<script>
function order(){
  window.open(
    "https://www.instagram.com/rer62033/",
    "_blank"
  );
}
</script>

</body>
</html>
